    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, getDocs, onSnapshot, query, where, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Provide Firebase instances to the global scope so React can use them
        window.FirebaseInit = async () => {
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'pai-ceria-app';
            
            // UNTUK GITHUB PAGES: Ganti nilai di bawah ini dengan konfigurasi Firebase Anda sendiri
            // Anda bisa mendapatkannya secara gratis dengan membuat proyek di console.firebase.google.com
            const myFirebaseConfig = {
                apiKey: "MASUKKAN_API_KEY_ANDA_DI_SINI",
                authDomain: "MASUKKAN_AUTH_DOMAIN_ANDA_DI_SINI",
                projectId: "MASUKKAN_PROJECT_ID_ANDA_DI_SINI",
                storageBucket: "MASUKKAN_STORAGE_BUCKET_ANDA_DI_SINI",
                messagingSenderId: "MASUKKAN_SENDER_ID_ANDA_DI_SINI",
                appId: "MASUKKAN_APP_ID_ANDA_DI_SINI"
            };

            // Menggunakan config Canvas jika ada, jika tidak gunakan config manual (untuk GitHub)
            const firebaseConfig = typeof __firebase_config !== 'undefined' && Object.keys(JSON.parse(__firebase_config)).length > 0 
                ? JSON.parse(__firebase_config) 
                : myFirebaseConfig;

            try {
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);

                // Authenticate
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                return { 
                    app, auth, db, appId,
                    // Expose Firestore methods so React can use them
                    fs: { doc, setDoc, getDoc, collection, getDocs, onSnapshot, query, where, deleteDoc }
                };
            } catch (error) {
                console.error("Firebase Error: Pastikan konfigurasi Firebase sudah diisi dengan benar untuk GitHub Pages.", error);
                
                // Fallback mock agar UI website tidak error (hanya database yang tidak tersimpan)
                return {
                    app: null, auth: { currentUser: { uid: 'local-test-uid' } }, db: null, appId,
                    fs: { 
                        doc: () => ({}), setDoc: async () => {}, getDoc: async () => ({ exists: () => false }), 
                        collection: () => ({}), getDocs: async () => ([]), onSnapshot: () => (() => {}), 
                        query: () => ({}), where: () => ({}), deleteDoc: async () => {} 
                    }
                };
            }
        };
    </script>

        // --- COMPONENTS ---

        // Reusable UI

        const Modal = ({ isOpen, onClose, title, children, hideCloseBtn }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl p-6 max-w-md w-full border-4 border-blue-400 card-3d">

        // Game Engines
        const QuizEngine = ({ gameData, onComplete }) => {
            const [currentQ, setCurrentQ] = useState(0);
            const [score, setScore] = useState(0);
            const [finished, setFinished] = useState(false);
            const [feedback, setFeedback] = useState(null);

            const handleAnswer = (opt) => {
                if (feedback) return; // Prevent double click
                
                const isCorrect = opt === gameData.questions[currentQ].answer;
                setFeedback(isCorrect ? 'correct' : 'wrong');
                
                if (isCorrect) setScore(s => s + 1);

                setTimeout(() => {
                    setFeedback(null);
                    if (currentQ < gameData.questions.length - 1) {
                        setCurrentQ(c => c + 1);
                    } else {
                        setFinished(true);
                        // Calculate percentage score (0-100)
                        const finalScore = Math.round(((score + (isCorrect ? 1 : 0)) / gameData.questions.length) * 100);
                        onComplete(finalScore);
                    }
                }, 1500);
            };

            if (finished) {
                return (
                    <div className="text-center py-10 bg-white rounded-3xl p-6 border-4 border-yellow-400">
                        <h3 className="text-3xl font-bold text-green-500 mb-4">Luar Biasa! 🎉</h3>
                        <p className="text-xl mb-4">Kamu telah menyelesaikan misi ini.</p>
                        <div className="text-5xl mb-6">Skor: {Math.round((score / gameData.questions.length) * 100)}</div>
                        <p className="text-lg text-gray-600">Nilai sudah disimpan secara otomatis.</p>
                    </div>
                );
            }

            const q = gameData.questions[currentQ];
            return (
                <div className="bg-white rounded-3xl p-6 md:p-10 border-4 border-blue-400 relative">
                    <div className="absolute top-4 right-4 bg-yellow-300 px-4 py-1 rounded-full font-bold">
                        Soal {currentQ + 1} / {gameData.questions.length}
                    </div>
                    <h3 className="text-2xl font-bold mb-8 mt-6 text-center">{q.q}</h3>
                    <div className="flex flex-col gap-4">
                        {q.options.map((opt, i) => {
                            let btnColor = 'bg-blue-100 hover:bg-blue-200';
                            if (feedback) {
                                if (opt === q.answer) btnColor = 'bg-green-400 text-white';
                                else if (feedback === 'wrong') btnColor = 'bg-red-400 text-white';
                            }
                            return (
                                <button 
                                    key={i} 
                                    onClick={() => handleAnswer(opt)}
                                    className={`p-4 rounded-2xl text-xl font-bold border-2 border-slate-800 btn-3d transition-colors ${btnColor}`}
                                >
                                    {opt}
                                </button>
                            );
                        })}
                    </div>
                    {feedback === 'correct' && <div className="mt-6 text-center text-xl font-bold text-green-500 animate-bounce">Masyaallah, Jawabanmu Benar! ⭐</div>}
                    {feedback === 'wrong' && <div className="mt-6 text-center text-xl font-bold text-red-500">Ups, kurang tepat. Ayo coba soal berikutnya!</div>}
                </div>
            );
        };

        const MatchEngine = ({ gameData, onComplete }) => {
            const [selectedA, setSelectedA] = useState(null);
            const [selectedB, setSelectedB] = useState(null);
            const [matched, setMatched] = useState([]);
            const [mistakes, setMistakes] = useState(0);

            // Shuffle items initially
            const itemsA = useMemo(() => [...gameData.pairs].sort(() => Math.random() - 0.5), [gameData]);
            const itemsB = useMemo(() => [...gameData.pairs].sort(() => Math.random() - 0.5), [gameData]);

            useEffect(() => {
                if (selectedA && selectedB) {
                    if (selectedA.id === selectedB.id) {
                        setMatched(prev => [...prev, selectedA.id]);
                        setSelectedA(null);
                        setSelectedB(null);
                    } else {
                        setMistakes(m => m + 1);
                        setTimeout(() => {
                            setSelectedA(null);
                            setSelectedB(null);
                        }, 800);
                    }
                }
            }, [selectedA, selectedB]);

            useEffect(() => {
                if (matched.length === gameData.pairs.length && gameData.pairs.length > 0) {
                    // Calculate score based on mistakes. Max 100, min 20.
                    let finalScore = 100 - (mistakes * 15);
                    if (finalScore < 20) finalScore = 20;
                    setTimeout(() => onComplete(finalScore), 1000);
                }
            }, [matched, mistakes, gameData, onComplete]);

            if (matched.length === gameData.pairs.length) {
                return (
                    <div className="text-center py-10 bg-white rounded-3xl p-6 border-4 border-yellow-400">
                        <h3 className="text-3xl font-bold text-green-500 mb-4">Hebat Sekali! 🎉</h3>
                        <p className="text-xl mb-4">Semua pasangan berhasil ditemukan.</p>
                        <p className="text-lg text-gray-600">Nilai sudah disimpan.</p>
                    </div>
                );
            }

            return (
                <div className="bg-white rounded-3xl p-6 border-4 border-orange-400">
                    <h3 className="text-xl font-bold text-center mb-6">Cocokkan kartu di kiri dengan pasangannya di kanan!</h3>
                    <div className="grid grid-cols-2 gap-4 md:gap-8">
                        {/* Column A */}
                        <div className="flex flex-col gap-3">
                            {itemsA.map(item => {
                                const isMatched = matched.includes(item.id);
                                const isSelected = selectedA?.id === item.id;
                                let bgClass = 'bg-blue-100 border-blue-400';
                                if (isMatched) bgClass = 'bg-green-300 border-green-500 opacity-50';
                                else if (isSelected) bgClass = 'bg-yellow-300 border-yellow-500';
                                
                                return (
                                    <button 
                                        key={`a-${item.id}`}
                                        disabled={isMatched || selectedA}
                                        onClick={() => setSelectedA(item)}
                                        className={`p-4 rounded-xl border-4 font-bold text-lg text-slate-700 transition-all ${bgClass}`}
                                    >
                                        {item.a}
                                    </button>
                                );
                            })}
                        </div>
                        {/* Column B */}
                        <div className="flex flex-col gap-3">
                            {itemsB.map(item => {
                                const isMatched = matched.includes(item.id);
                                const isSelected = selectedB?.id === item.id;
                                let bgClass = 'bg-purple-100 border-purple-400';
                                if (isMatched) bgClass = 'bg-green-300 border-green-500 opacity-50';
                                else if (isSelected) bgClass = 'bg-yellow-300 border-yellow-500';
                                
                                return (
                                    <button 
                                        key={`b-${item.id}`}
                                        disabled={isMatched || selectedB}
                                        onClick={() => setSelectedB(item)}
                                        className={`p-4 rounded-xl border-4 font-bold text-lg text-slate-700 transition-all ${bgClass}`}
                                    >
                                        {item.b}
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        // Main Application

                    const links = [];
                    snap.forEach(doc => links.push({ id: doc.id, ...doc.data() }));
                    setAdditionalLinks(links);
                }, (err) => console.error("Error fetching links:", err));
                return () => unsub();
            }, [fbContext]);

            const showAlert = (msg) => setShowModal({ isOpen: true, msg });

            const saveUserData = async (userData) => {

                                                                <h5 className="font-bold text-blue-700 leading-tight pr-8">{link.title}</h5>
                                                            </div>
                                                            <button onClick={() => handleDeleteLink(link.id)} className="text-red-500 font-black bg-red-50 w-8 h-8 rounded-full flex items-center justify-center hover:bg-red-100 absolute top-2 right-2">✕</button>
                                                        </div>
                                                        <a href={link.url} target="_blank" rel="noreferrer" className="text-xs text-gray-500 truncate hover:text-blue-500 block">{link.url}</a>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                        </div>
                    </div>
                );
            };

            if (loading) return <div className="min-h-screen flex items-center justify-center text-2xl font-bold text-blue-500 animate-pulse">Memuat PAI CERIA...</div>;

            return (
                <>
                    {view === 'login' && renderLogin()}
                    {view === 'student_dash' && user && renderStudentDashboard()}
                    {view === 'chapter' && user && renderChapter()}
                    {view === 'teacher_dash' && renderTeacherDashboard()}
                    
                    <Modal isOpen={showModal.isOpen} onClose={() => setShowModal({ isOpen: false, msg: '' })} title="Informasi">
                        <p className="text-lg text-gray-700 whitespace-pre-wrap">{showModal.msg}</p>
                    </Modal>

                    {/* Delete Confirmation Modal */}
                    <Modal 
                        isOpen={!!studentToDelete} 
                        onClose={() => setStudentToDelete(null)} 
                        title="⚠️ Konfirmasi Hapus"
                        hideCloseBtn={true}
                    >
                        <p className="text-lg text-gray-700 mb-6 text-center font-medium">
                            Apakah Anda yakin ingin menghapus data dan nilai milik <br/>
                            <strong className="text-xl text-blue-600">{studentToDelete?.name}</strong>?
                            <br/><br/>
                            <span className="text-red-500 text-sm font-bold bg-red-50 p-2 rounded-lg block">Tindakan ini permanen dan tidak dapat dibatalkan.</span>
                        </p>
                        <div className="flex justify-center gap-4">
                            <Button onClick={() => setStudentToDelete(null)} color="bg-gray-200" className="text-gray-700 shadow-none border-gray-400">Batal</Button>
                            <Button onClick={handleDeleteStudent} color="bg-red-500" className="text-white border-red-700 shadow-none">Ya, Hapus Data</Button>
                        </div>
                    </Modal>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
